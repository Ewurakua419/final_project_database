<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div id="admin-nav-container"></div>
  
  <main class="admin-container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <h1 class="display-2" style="margin-bottom: var(--spacing-xs); font-size: var(--type-display-2-size); font-weight: var(--type-display-2-weight); letter-spacing: -1.875px;">Platform Health</h1>
    <p style="color: var(--color-ink-muted); font-size: var(--type-body-md-size); margin-top: 0;">Global oversight of the marketplace ecosystem.</p>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Total Platform Revenue</div>
        <div class="metric-value" id="stat-revenue">GH₵0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Registered Users</div>
        <div class="metric-value" id="stat-users">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Orders</div>
        <div class="metric-value" id="stat-orders">0</div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr; gap: var(--spacing-xl); margin-top: var(--spacing-xxl);">
      
      <!-- Users Table -->
      <div>
        <h2 class="heading-2" style="margin-bottom: var(--spacing-sm); font-size: var(--type-heading-2-size); font-weight: var(--type-heading-2-weight);">User Directory</h2>
        <table class="data-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="users-body">
            <tr><td colspan="5" style="text-align: center;">Loading users...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <script type="module" src="admin-navbar.js"></script>
  <script>
    if (!localStorage.getItem("adminAuthToken")) {
      window.location.href = "login.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      const headers = { "Authorization": "Bearer " + localStorage.getItem("adminAuthToken") };
      
      // Fetch stats
      fetch("http://127.0.0.1:5001/admin/stats", { headers })
        .then(res => res.json())
        .then(data => {
          document.getElementById('stat-revenue').textContent = '$' + (data.total_revenue || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
          document.getElementById('stat-users').textContent = data.total_users || 0;
          document.getElementById('stat-orders').textContent = data.total_orders || 0;
        })
        .catch(err => console.error(err));

      // Fetch users
      fetch("http://127.0.0.1:5001/admin/users", { headers })
        .then(res => res.json())
        .then(data => {
          const tbody = document.getElementById("users-body");
          tbody.innerHTML = "";
          const users = data.users || [];
          
          users.forEach(u => {
            let roleBadge = `<span class="badge badge-customer">Customer</span>`;
            if (u.role === 'vendor') {
              roleBadge = `<span class="badge badge-vendor">Vendor</span>`;
            }
            
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${u.id}</td>
              <td style="font-weight: 500;">${u.name}</td>
              <td>${u.email}</td>
              <td>${roleBadge}</td>
              <td><button class="button-utility" style="padding: 4px 8px; color: var(--color-accent-orange); border-color: var(--color-accent-orange);">Suspend</button></td>
            `;
            tbody.appendChild(tr);
          });
        })
        .catch(err => console.error(err));
    });
  </script>
</body>
</html>
