<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Orders - Ecommerce store</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="../products/products.css">
  <link rel="stylesheet" href="orders.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="orders-layout">
    <header class="orders-header">
      <h1 class="orders-title">Your Orders</h1>
    </header>

    <div id="orders-container">
      <div class="loading-state">Loading your orders...</div>
    </div>
  </div>

  <script type="module" src="../navbar.js"></script>
  <script type="module">
    function initOrdersPage() {
      // Fetch and display orders
      fetch("http://127.0.0.1:5001/orders", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("orders-container");
          container.innerHTML = "";

          const orders = data.orders || [];

          if (orders.length === 0) {
            container.innerHTML = `
              <div class="empty-orders-state">
                <h3>No orders placed yet</h3>
                <p>Looks like you haven't placed any orders yet.</p>
                <a href="../products/products.html" class="button-primary">Start Shopping</a>
              </div>
            `;
            return;
          }

          orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleDateString(undefined, {
              year: 'numeric', month: 'long', day: 'numeric'
            });
            
            const total = order.pricing_summary.grand_total.toFixed(2);
            
            let itemsHtml = "";
            order.items.forEach(item => {
              itemsHtml += `
                <div class="order-item">
                  <div class="order-item-image">
                    <img src="${item.image}" alt="${item.name}" style="width:100%; height:100%; object-fit:contain;">
                  </div>
                  <div class="order-item-details">
                    <h4 class="order-item-title">${item.name}</h4>
                    <div class="order-item-meta">Qty: ${item.quantity}</div>
                  </div>
                  <div class="order-item-price">$${item.item_total.toFixed(2)}</div>
                </div>
              `;
            });

            const shippingName = order.shipping_address ? 
              `${order.shipping_address.first_name || 'User'} ${order.shipping_address.last_name || ''}`.trim() : 
              "User";

            container.innerHTML += `
              <div class="order-card">
                <div class="order-card-header">
                  <div class="order-meta-group">
                    <span class="order-meta-label">Order Placed</span>
                    <span class="order-meta-value">${date}</span>
                  </div>
                  <div class="order-meta-group">
                    <span class="order-meta-label">Total</span>
                    <span class="order-meta-value">$${total}</span>
                  </div>
                  <div class="order-meta-group" style="margin-left: auto; text-align: right;">
                    <span class="order-meta-label">Order # ${order.order_id}</span>
                    <span class="order-meta-value status-${order.status}">${order.status.charAt(0).toUpperCase() + order.status.slice(1)}</span>
                  </div>
                </div>
                
                ${order.delivery ? `
                <div style="padding: 16px var(--spacing-lg); background-color: var(--color-canvas-soft, #f6f5f4); border-bottom: 1px solid var(--color-hairline, #e6e6e6); font-size: 0.85rem; color: var(--color-ink-secondary, #31302e);">
                  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--spacing-md, 16px); line-height: 1.5;">
                    <div>
                      <span style="color: var(--color-ink-muted, #615d59); font-weight: 600; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Delivery Status</span>
                      <span style="font-weight: 600; color: ${order.delivery.delivery_status === 'delivered' ? '#1aae39' : (order.delivery.delivery_status === 'on the way' ? '#0075de' : '#dd5b00')};">
                        ${order.delivery.delivery_status.charAt(0).toUpperCase() + order.delivery.delivery_status.slice(1)}
                      </span>
                    </div>
                    <div>
                      <span style="color: var(--color-ink-muted, #615d59); font-weight: 600; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Estimated Arrival</span>
                      <span style="font-weight: 500;">${order.delivery.estimated_delivery_date}</span>
                    </div>
                    <div>
                      <span style="color: var(--color-ink-muted, #615d59); font-weight: 600; display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;">Carrier</span>
                      <span style="font-weight: 500;">${order.delivery.shipping_company || 'N/A'}</span>
                    </div>
                  </div>
                </div>
                ` : ''}

                <div class="order-items-list">
                  ${itemsHtml}
                </div>
              </div>
            `;
          });
        })
        .catch(err => {
          console.error("Failed to fetch orders:", err);
          document.getElementById("orders-container").innerHTML = `
            <div class="empty-orders-state">
              <h3>Error loading orders</h3>
              <p>Please try again later.</p>
            </div>
          `;
        });
    }

    initOrdersPage();
  </script>
</body>
</html>
