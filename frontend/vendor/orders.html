<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orders - Vendor Portal</title>
  <link rel="stylesheet" href="vendor-base.css">

</head>
<body>

  <div id="vendor-nav-container"></div>
  <main class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <div style="margin-bottom: var(--spacing-xl);">
      <h1 class="display-2">Manage Orders</h1>
    </div>

      <div id="orders-container">
        <div class="loading-state">Loading your orders...</div>
      </div>
    </main>

  <script type="module" src="vendor-navbar.js"></script>
  <script>
    if (!localStorage.getItem("vendorAuthToken")) {
      window.location.href = "login.html";
    }
    document.addEventListener("DOMContentLoaded", () => {

      const container = document.getElementById("orders-container");

      fetch("http://127.0.0.1:5001/vendor/orders", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("vendorAuthToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          container.innerHTML = "";
          
          if(data.orders.length === 0) {
            container.innerHTML = `
              <div class="error-state" style="background: var(--color-canvas); border-color: var(--color-hairline); color: var(--color-ink-muted);">
                You haven't received any orders yet.
              </div>`;
            return;
          }

          data.orders.forEach(order => {
            const date = new Date(order.created_at).toLocaleDateString(undefined, {
              year: 'numeric', month: 'short', day: 'numeric'
            });
            const shippingName = order.shipping_address ? `${order.customer_first_name || ''} ${order.customer_last_name || ''}`.trim() || 'Customer' : 'Customer';
            const address = order.shipping_address ? `${order.shipping_address.street || ''}, ${order.shipping_address.city || ''}, ${order.shipping_address.country || ''}` : 'N/A';
            const total = order.pricing_summary.grand_total.toFixed(2);
            
            // Status styling
            let statusStyle = '';
            if (order.status === 'pending') {
              statusStyle = 'background-color: rgba(221, 91, 0, 0.1); color: var(--color-accent-orange); border-color: transparent;';
            } else if (order.status === 'shipped') {
              statusStyle = 'background-color: rgba(42, 157, 153, 0.1); color: var(--color-primary); border-color: transparent;';
            } else {
              statusStyle = 'background-color: rgba(26, 174, 57, 0.1); color: var(--color-accent-green); border-color: transparent;';
            }

            // Build item fulfillment rows
            let itemsHtml = '';
            const pendingCount = (order.items || []).filter(i => i.item_status === 'pending').length;
            (order.items || []).forEach(item => {
              const isPending = item.item_status === 'pending';
              const badgeStyle = isPending
                ? 'background-color: rgba(221, 91, 0, 0.1); color: var(--color-accent-orange);'
                : 'background-color: rgba(26, 174, 57, 0.1); color: var(--color-accent-green);';
              const badgeText = isPending ? 'Pending' : 'Sent to Port';
              const actionBtn = isPending
                ? `<button class="button-utility send-to-port-btn" data-order-id="${order.order_id}" data-product-id="${item.product_id}" style="padding: 3px 10px; font-size: 11px; white-space: nowrap;">Send to Port</button>`
                : `<span style="color: var(--color-accent-green); font-size: 12px; font-weight: 500;">✓ Done</span>`;
              itemsHtml += `
                <div style="display: flex; align-items: center; gap: var(--spacing-sm); padding: 8px 0; border-bottom: 1px solid var(--color-canvas, #f6f5f4);">
                  <div style="flex: 1; font-size: 14px; font-weight: 500;">${item.name}</div>
                  <div style="font-size: 13px; color: var(--color-ink-muted);">Qty: ${item.quantity}</div>
                  <span style="padding: 2px 8px; border-radius: var(--rounded-full); font-size: 11px; font-weight: 600; ${badgeStyle}">${badgeText}</span>
                  ${actionBtn}
                </div>
              `;
            });

            const fulfillmentNotice = pendingCount > 0
              ? `<div style="padding: 8px 12px; margin-top: var(--spacing-sm); background: rgba(221, 91, 0, 0.06); border-radius: var(--rounded-md); font-size: 12px; color: var(--color-accent-orange);">⚠ ${pendingCount} item(s) still pending — courier dispatch is blocked until all items are sent to port.</div>`
              : `<div style="padding: 8px 12px; margin-top: var(--spacing-sm); background: rgba(26, 174, 57, 0.06); border-radius: var(--rounded-md); font-size: 12px; color: var(--color-accent-green);">✓ All items sent to port — courier can dispatch.</div>`;

            let deliveryStatusLabel = 'Sent to Port';
            if (order.status === 'on the way') deliveryStatusLabel = 'In Transit';
            else if (order.status === 'delivered') deliveryStatusLabel = 'Delivered';
            else if (order.status === 'sent to port') deliveryStatusLabel = 'At Port';

            container.innerHTML += `
              <div class="feature-card" style="margin-bottom: var(--spacing-xl);">
                <div class="order-header">
                  <span class="order-id">${order.order_id}</span>
                  <span class="status-pill" style="${statusStyle} font-size: var(--type-caption-size); padding: 4px 12px;">Courier: ${deliveryStatusLabel}</span>
                </div>
                <div class="order-details">
                  <div>
                    <strong>Customer:</strong> ${order.customer_email || 'Customer'}<br>
                    <strong>Phone:</strong> ${order.customer_phone || 'N/A'}<br>
                    <strong>Date:</strong> ${date}<br>
                    <strong>Shipping:</strong> ${address}
                  </div>
                  <div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: var(--spacing-sm);">
                    <div><strong>Total:</strong> <span style="color: var(--color-primary); font-size: 1.1rem; font-weight: 600;">GH₵${total}</span></div>
                    <button class="button-utility view-details-btn" data-order='${JSON.stringify(order).replace(/'/g, "&#39;")}' style="padding: 4px 12px; font-size: var(--type-caption-size);">View Full Details</button>
                  </div>
                </div>
                <div style="padding: 0 var(--spacing-lg) var(--spacing-md); margin-top: calc(-1 * var(--spacing-sm));">
                  <div style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--color-ink-muted); margin-bottom: var(--spacing-xs);">Item Fulfillment</div>
                  ${itemsHtml}
                  ${fulfillmentNotice}
                </div>
              </div>
            `;
          });

          // View Details click handler
          document.querySelectorAll('.view-details-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const orderData = e.target.getAttribute('data-order');
              sessionStorage.setItem('vendor_current_order', orderData);
              window.location.href = 'order_detail.html';
            });
          });

          // Send to Port click handler (item fulfillment)
          document.querySelectorAll('.send-to-port-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              const orderId = e.target.getAttribute('data-order-id');
              const productId = e.target.getAttribute('data-product-id');
              e.target.innerText = 'Sending...';
              e.target.disabled = true;
              try {
                const res = await fetch(`http://127.0.0.1:5001/vendor/orders/${orderId}/items/${productId}/status`, {
                  method: 'PUT',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + localStorage.getItem('vendorAuthToken')
                  },
                  body: JSON.stringify({ item_status: 'sent to port' })
                });
                const data = await res.json();
                if (res.ok) {
                  window.location.reload();
                } else {
                  alert(data.error || 'Failed to update item status');
                  e.target.innerText = 'Send to Port';
                  e.target.disabled = false;
                }
              } catch (err) {
                console.error(err);
                alert('Network error');
                e.target.innerText = 'Send to Port';
                e.target.disabled = false;
              }
            });
          });
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<div class="error-state">Failed to load orders.</div>';
        });
    });
  </script>
</body>
</html>
