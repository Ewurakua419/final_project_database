<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory - Vendor Portal</title>
  <link rel="stylesheet" href="vendor-base.css">

</head>
<body>

  <div id="vendor-nav-container"></div>
  <main class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <div class="flex-row" style="justify-content: space-between; margin-bottom: var(--spacing-xl);">
      <h1 class="display-2">Inventory</h1>
      <a href="add_product.html" class="button-utility" style="background-color: var(--color-primary); color: white; border: none;">+ Add Product</a>
    </div>

      <div id="vendor-products-container">
        <div class="loading-state">Loading your inventory...</div>
      </div>
    </main>

  <script type="module" src="vendor-navbar.js"></script>
  <script>
    if (!localStorage.getItem("vendorAuthToken")) {
      window.location.href = "login.html";
    }
    document.addEventListener("DOMContentLoaded", () => {


      const container = document.getElementById("vendor-products-container");

      fetch("http://127.0.0.1:5001/vendor/products", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("vendorAuthToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          container.innerHTML = "";
          
          if(data.products.length === 0) {
            container.innerHTML = `
              <div class="error-state" style="background: var(--color-canvas); border-color: var(--color-hairline); color: var(--color-ink-muted);">
                You haven't added any products yet.
              </div>`;
            return;
          }

          data.products.forEach(product => {
            const price = (product.priceCents / 100).toFixed(2);
            container.innerHTML += `
              <div class="product-list-card">
                <img src="${product.image}" class="product-thumb" alt="${product.name}">
                <div class="product-info">
                  <h3 class="product-title">${product.name}</h3>
                  <div class="product-meta">
                    <span>Category: ${product.type || 'General'}</span>
                    <span>Stock: 50 units</span>
                  </div>
                </div>
                <div class="product-price">$${price}</div>
                <div class="product-actions">
                  <a href="edit_product.html?id=${product.id}" class="button-utility" style="font-size: var(--type-caption-size); text-decoration: none;">Edit</a>
                  <button class="button-utility" style="font-size: var(--type-caption-size); color: var(--color-accent-orange);" onclick="deleteProduct('${product.id}', this)">Delete</button>
                </div>
              </div>
            `;
          });
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<div class="error-state">Failed to load inventory.</div>';
        });
        
      window.deleteProduct = (productId, btnElement) => {
        if (!confirm("Are you sure you want to delete this product?")) return;
        
        btnElement.innerText = "Deleting...";
        btnElement.disabled = true;
        
        fetch("http://127.0.0.1:5001/vendor/products/" + productId, {
          method: "DELETE",
          headers: {
            "Authorization": "Bearer " + localStorage.getItem("vendorAuthToken")
          }
        })
        .then(res => {
          if(!res.ok) throw new Error("Delete failed");
          // Remove the card from the UI
          btnElement.closest('.product-list-card').remove();
        })
        .catch(err => {
          console.error(err);
          alert("Failed to delete product.");
          btnElement.innerText = "Delete";
          btnElement.disabled = false;
        });
      };
    });
  </script>
</body>
</html>
