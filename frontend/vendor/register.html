<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Portal - Register</title>
  <link rel="stylesheet" href="vendor-base.css">

</head>
<body>

  <div class="auth-layout">
    <a href="#" style="font-weight: 600; text-decoration: none; color: var(--color-ink-secondary);">
      Simple Ecommerce Store
    </a>
    <div class="ex-auth-form-card">
      <div class="auth-header">
        <h1>Become a Seller</h1>
        <p>Apply for a vendor account to start selling.</p>
      </div>

      <form id="vendor-register-form" class="flex-col" style="gap: var(--spacing-md);">
        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="vendor_name">Vendor Name</label>
          <input type="text" id="vendor_name" class="text-input" placeholder="My Shop Name" required autofocus>
        </div>

        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="phone_number">Phone Number</label>
          <input type="tel" id="phone_number" class="text-input" placeholder="0241234567" required>
        </div>

        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="email">Email</label>
          <input type="email" id="email" class="text-input" placeholder="vendor@example.com" required>
        </div>

        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="password">Password</label>
          <input type="password" id="password" class="text-input" placeholder="••••••••" required>
        </div>

        <div id="error-message" style="color: red; font-size: 14px; display: none;"></div>

        <button type="submit" class="button-primary" style="width: 100%; justify-content: center; margin-top: var(--spacing-md);">
          Submit Application
        </button>
      </form>

      <div style="margin-top: var(--spacing-xl); text-align: center; font-size: var(--type-body-sm-size); color: var(--color-ink-muted);">
        Already have a vendor account? 
        <a href="login.html" style="font-weight: 600; text-decoration: none; color: var(--color-primary);">Log in</a>
      </div>
      <div style="margin-top: var(--spacing-md); text-align: center;">
        <a href="../login.html" style="font-size: var(--type-caption-size); color: var(--color-ink-faint); text-decoration: none;">Return to Customer Store</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("vendor-register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const vendor_name = document.getElementById('vendor_name').value;
      const phone_number = document.getElementById('phone_number').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      try {
        const response = await fetch('http://127.0.0.1:5001/vendor/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            vendor_name: vendor_name,
            phone_number: phone_number,
            email: email, 
            password: password 
          })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          alert("Application submitted successfully! Please log in.");
          window.location.href = 'login.html';
        } else {
          errorDiv.style.display = 'block';
          errorDiv.textContent = data.error || 'An error occurred during registration.';
        }
      } catch (error) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Could not connect to the server.';
      }
    });
  </script>
</body>
</html>
