<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Vendor Portal</title>
  <link rel="stylesheet" href="vendor-base.css">

</head>
<body>

  <div id="vendor-nav-container"></div>
  <main class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <div style="margin-bottom: var(--spacing-xl); text-align: center;">
      <h1 class="display-2">Add New Product</h1>
    </div>

      <form class="feature-card" style="max-width: 600px; margin: 0 auto;" id="add-product-form">
        <div class="form-grid">
          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Product Name</label>
            <input type="text" class="text-input" id="prod-name" placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
          </div>


          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Category</label>
            <select class="text-input" id="prod-category" required onchange="toggleDynamicFields()">
              <option value="fashion">Fashion</option>
              <option value="beauty">Beauty</option>
            </select>
          </div>

          <!-- Fashion Dynamic Fields -->
          <div id="fashion-fields" class="full-width" style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Color</label>
              <input type="text" class="text-input" id="fashion-color" placeholder="e.g. Red">
            </div>
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Material</label>
              <input type="text" class="text-input" id="fashion-material" placeholder="e.g. Cotton">
            </div>
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Size</label>
              <select class="text-input" id="fashion-size">
                <option value="">Select Size</option>
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
                <option value="XL">XL</option>
                <option value="XXL">XXL</option>
              </select>
            </div>
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Gender Category</label>
              <select class="text-input" id="fashion-gender">
                <option value="">Select Gender</option>
                <option value="men">Men</option>
                <option value="women">Women</option>
                <option value="unisex">Unisex</option>
                <option value="kids">Kids</option>
              </select>
            </div>
          </div>

          <!-- Beauty Dynamic Fields -->
          <div id="beauty-fields" class="full-width" style="display: none; grid-template-columns: 1fr 1fr; gap: var(--spacing-md);">
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Skin Type</label>
              <input type="text" class="text-input" id="beauty-skintype" placeholder="e.g. Dry, Oily">
            </div>
            <div class="flex-col" style="gap: var(--spacing-xs);">
              <label class="eyebrow text-muted">Volume/Weight</label>
              <input type="text" class="text-input" id="beauty-volume" placeholder="e.g. 200ml">
            </div>
            <div class="flex-col" style="gap: var(--spacing-xs); grid-column: span 2;">
              <label class="eyebrow text-muted" style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="checkbox" id="beauty-organic"> Is Organic
              </label>
            </div>
          </div>

          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Price (GH₵)</label>
            <input type="number" step="0.01" class="text-input" id="prod-price" placeholder="299.99" required>
          </div>

          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Initial Stock</label>
            <input type="number" class="text-input" id="prod-stock" placeholder="50" required>
          </div>

          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Image URL</label>
            <input type="url" class="text-input" id="prod-image" placeholder="https://example.com/image.jpg" required>
          </div>

          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Description</label>
            <textarea class="text-input" id="prod-description" rows="3" placeholder="Enter product details..." required></textarea>
          </div>
        </div>

        <div style="margin-top: var(--spacing-xl); display: flex; gap: var(--spacing-md); justify-content: flex-end;">
          <a href="products.html" class="button-utility" style="text-decoration: none;">Cancel</a>
          <button type="submit" id="save-btn" class="button-utility" style="background-color: var(--color-primary); color: white; border: none;">Create Product</button>
        </div>
      </form>
    </main>

  <script type="module" src="vendor-navbar.js"></script>
  <script>
    if (!localStorage.getItem("vendorAuthToken")) {
      window.location.href = "login.html";
    }
    document.addEventListener("DOMContentLoaded", () => {


      window.toggleDynamicFields = () => {
        const category = document.getElementById("prod-category").value;
        const fashionFields = document.getElementById("fashion-fields");
        const beautyFields = document.getElementById("beauty-fields");
        
        if (category === "fashion") {
          fashionFields.style.display = "grid";
          beautyFields.style.display = "none";
        } else if (category === "beauty") {
          fashionFields.style.display = "none";
          beautyFields.style.display = "grid";
        }
      };

      // Call once to initialize
      toggleDynamicFields();

      document.getElementById("add-product-form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        const btn = document.getElementById("save-btn");
        const originalText = btn.innerText;
        btn.innerText = "Saving...";
        btn.disabled = true;

        const category = document.getElementById("prod-category").value;
        const productData = {
          name: document.getElementById("prod-name").value,
          type: category,
          price: parseFloat(document.getElementById("prod-price").value),
          stock: parseInt(document.getElementById("prod-stock").value),
          image: document.getElementById("prod-image").value,
          description: document.getElementById("prod-description").value,
        };

        if (category === "fashion") {
          productData.fashion_attributes = {
            Color: document.getElementById("fashion-color").value,
            Material: document.getElementById("fashion-material").value,
            Size: document.getElementById("fashion-size").value,
            Gender_category: document.getElementById("fashion-gender").value,
          };
        } else if (category === "beauty") {
          productData.beauty_attributes = {
            skin_type: document.getElementById("beauty-skintype").value,
            volume_weight: document.getElementById("beauty-volume").value,
            Is_organic: document.getElementById("beauty-organic").checked,
          };
        }

        fetch("http://127.0.0.1:5001/vendor/products", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("vendorAuthToken")
          },
          body: JSON.stringify(productData)
        })
        .then(res => {
          if (!res.ok) throw new Error("Failed to save product");
          return res.json();
        })
        .then(data => {
          alert("Product saved successfully!");
          window.location.href = "products.html";
        })
        .catch(err => {
          console.error(err);
          btn.innerText = "Error: Please try again";
          btn.style.backgroundColor = "var(--color-accent-orange)";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "";
            btn.disabled = false;
          }, 2000);
        });
      });
    });
  </script>
</body>
</html>
