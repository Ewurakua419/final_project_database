<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Simple Ecommerce Store</title>
  <link rel="stylesheet" href="base.css">
</head>
<body>

  <div class="auth-layout">
    <a href="#" style="font-weight: 600; text-decoration: none; color: var(--color-ink-secondary);">
      Simple Ecommerce Store
    </a>
    <div class="ex-auth-form-card">
      <div class="auth-header">
        <h1>Sign in</h1>
        <p>Welcome back! Please enter your details.</p>
      </div>

      <form id="customer-login-form" class="flex-col" style="gap: var(--spacing-md);">
        
        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="email">Email</label>
          <input type="email" id="email" class="text-input" placeholder="email@example.com" required autofocus>
        </div>

        <div class="form-group flex-col" style="gap: var(--spacing-xs);">
          <label class="eyebrow text-muted" for="password">Password</label>
          <input type="password" id="password" class="text-input" placeholder="••••••••" required>
        </div>
        
        <div id="error-message" style="color: red; font-size: 14px; display: none;"></div>

        <button type="submit" class="button-primary" style="width: 100%; justify-content: center; margin-top: var(--spacing-md);">
          Log in
        </button>
      </form>

      <div style="margin-top: var(--spacing-xl); text-align: center; font-size: var(--type-body-sm-size); color: var(--color-ink-muted);">
        Don't have an account? 
        <a href="register.html" style="font-weight: 600; text-decoration: none; color: var(--color-primary);">Sign up here</a>
      </div>
      <div style="margin-top: var(--spacing-md); text-align: center;">
        <a href="vendor/login.html" style="font-size: var(--type-caption-size); color: var(--color-ink-faint); text-decoration: none;">Are you a vendor? Log in here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('customer-login-form').addEventListener('submit', async function(e) {
      e.preventDefault(); // Prevent default form submission
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      try {
        const response = await fetch('http://127.0.0.1:5001/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email: email, password: password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Success! Save the token
          localStorage.setItem('authToken', data.token);

          // Merge guest cart if present
          const guestCartStr = localStorage.getItem("guestCart");
          if (guestCartStr) {
            try {
              const guestCart = JSON.parse(guestCartStr) || [];
              for (const item of guestCart) {
                // Send a POST fetch to add to backend cart
                await fetch('http://127.0.0.1:5001/cart', {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + data.token
                  },
                  body: JSON.stringify({ product_id: item.product_id, quantity: item.quantity })
                });
              }
              localStorage.removeItem("guestCart");
            } catch (err) {
              console.error("Error merging guest cart", err);
            }
          }

          // Handle redirects
          const urlParams = new URLSearchParams(window.location.search);
          const redirect = urlParams.get('redirect');
          if (redirect === 'checkout') {
            window.location.href = 'g-checkout/checkout.html';
          } else if (redirect === 'product_detail') {
            const prodId = urlParams.get('id');
            window.location.href = `products/product_detail.html?id=${prodId}`;
          } else {
            window.location.href = 'products/products.html';
          }
        } else {
          // Show error message from backend
          errorDiv.style.display = 'block';
          errorDiv.textContent = data.error || 'An error occurred during login.';
        }
      } catch (error) {
        errorDiv.style.display = 'block';
        errorDiv.textContent = 'Could not connect to the server.';
      }
    });
  </script>
</body>
</html>
