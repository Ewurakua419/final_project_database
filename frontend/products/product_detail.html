<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Notion Styled Store</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="products.css">
  <link rel="stylesheet" href="product_detail.css">
</head>
<body>

  <div id="navbar-container"></div>

  <main class="page-layout container">
    <!-- Main Content Column -->
    <div class="main-content">
      <div id="product-showcase-container" class="product-showcase">
        <div class="loading-state">Loading product image...</div>
      </div>
      
      <div id="product-details-container">
        <div class="loading-state">Loading details...</div>
      </div>

      <!-- Reviews Section -->
      <div class="product-reviews-section">
        <h2 class="reviews-title">Customer Reviews</h2>
        
        <div class="feature-card write-review-container" style="margin-bottom: var(--spacing-xl);">
          <h3 class="title" style="margin-top: 0;">Write a Review</h3>
          <form id="review-form" style="display: flex; flex-direction: column; gap: var(--spacing-md);">
            <select id="review-rating" class="text-input" required>
              <option value="5">★★★★★ (5/5)</option>
              <option value="4">★★★★☆ (4/5)</option>
              <option value="3">★★★☆☆ (3/5)</option>
              <option value="2">★★☆☆☆ (2/5)</option>
              <option value="1">★☆☆☆☆ (1/5)</option>
            </select>
            <textarea id="review-text" class="text-input" rows="3" placeholder="Share your experience..." required></textarea>
            <button type="submit" class="button-secondary" style="align-self: flex-start;">Submit Review</button>
          </form>
        </div>

        <div id="reviews-container">
          <!-- Mock reviews will be injected here -->
        </div>
      </div>
    </div>

    <!-- Related Products Sidebar -->
    <aside class="sidebar">
      <h3 class="sidebar-title">Other Products</h3>
      <div id="related-products-container">
        <div class="loading-state">Loading related...</div>
      </div>
    </aside>
  </main>

  
  </div>

  <script type="module" src="../navbar.js"></script>
  <script type="module">
    import { addToCart, openCart } from '../cart.js';
    
    function initProductDetail() {
      // Page Logic
      const urlParams = new URLSearchParams(window.location.search);
      const currentProductId = urlParams.get('id');

      if (!currentProductId) {
        document.querySelector('.main-content').innerHTML = '<div class="error-state">No product selected.</div>';
        return;
      }

      // Fetch specific product
      fetch(`http://127.0.0.1:5001/product-items/${currentProductId}`)
        .then(res => {
          if(!res.ok) throw new Error("Product not found");
          return res.json();
        })
        .then(product => {
          const showcase = document.getElementById("product-showcase-container");
          const details = document.getElementById("product-details-container");
          
          showcase.innerHTML = `<img src="${product.image}" alt="${product.name}">`;
          
          const price = (product.price).toFixed(2);
          const fullStars = Math.floor(product.rating.stars);
          const hasHalfStar = product.rating.stars % 1 !== 0;
          let starsHtml = "";
          for (let i = 0; i < 5; i++) {
            if (i < fullStars) starsHtml += "★";
            else if (i === fullStars && hasHalfStar) starsHtml += "☆";
            else starsHtml += "☆";
          }

          let attributesHtml = "";
          if (product.type === "fashion" && product.fashion_attributes) {
            attributesHtml = `
              <div class="product-attributes" style="margin-top: var(--spacing-lg); padding: var(--spacing-md); background: var(--color-canvas-soft); border-radius: var(--rounded-md);">
                <h3 style="margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1rem;">Product Specs</h3>
                <ul style="list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm);">
                  <li><strong>Color:</strong> ${product.fashion_attributes.Color || 'N/A'}</li>
                  <li><strong>Material:</strong> ${product.fashion_attributes.Material || 'N/A'}</li>
                  <li><strong>Size:</strong> ${product.fashion_attributes.Size || 'N/A'}</li>
                  <li><strong>Gender:</strong> ${product.fashion_attributes.Gender_category || 'N/A'}</li>
                </ul>
              </div>
            `;
          } else if (product.type === "beauty" && product.beauty_attributes) {
            attributesHtml = `
              <div class="product-attributes" style="margin-top: var(--spacing-lg); padding: var(--spacing-md); background: var(--color-canvas-soft); border-radius: var(--rounded-md);">
                <h3 style="margin-top: 0; margin-bottom: var(--spacing-sm); font-size: 1rem;">Product Specs</h3>
                <ul style="list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm);">
                  <li><strong>Skin Type:</strong> ${product.beauty_attributes.skin_type || 'N/A'}</li>
                  <li><strong>Volume/Weight:</strong> ${product.beauty_attributes.volume_weight || 'N/A'}</li>
                  <li><strong>Organic:</strong> ${product.beauty_attributes.Is_organic ? 'Yes' : 'No'}</li>
                </ul>
              </div>
            `;
          }

          details.innerHTML = `
            <div class="product-info-header">
              <h1 class="product-detail-title">${product.name}</h1>
              <div class="product-meta-row">
                <div class="product-detail-rating">
                  <span class="stars">${starsHtml}</span>
                  <span class="rating-count">(${product.rating.count} reviews)</span>
                </div>
                <div class="product-detail-price">GH₵${price}</div>
              </div>
              <div class="action-bar">
                <select id="main-qty-select" class="qty-select-large" aria-label="Quantity">
                  <option value="1">1</option>
                  <option value="2">2</option>
                  <option value="3">3</option>
                  <option value="4">4</option>
                  <option value="5">5</option>
                </select>
                <button id="main-add-to-cart" class="button-primary" style="flex: 1; padding: 12px; font-size: 16px;">
                  Add to Cart
                </button>
              </div>
            </div>
            <br>
            <p class="product-description">
              ${product.description || "A high quality product crafted with attention to detail."}
            </p>
            ${attributesHtml}
          `;

          // Add to cart click
          document.getElementById("main-add-to-cart").addEventListener("click", (e) => {
            const btn = e.target;
            const qty = parseInt(document.getElementById("main-qty-select").value, 10);
            
            const originalText = btn.innerText;
            btn.innerText = "Adding...";
            
            addToCart(product.id, qty)
            .then(data => {
              btn.innerText = "Added!";
              btn.style.backgroundColor = "var(--color-accent-green)";
              btn.style.color = "var(--color-on-primary)";
              
              openCart();
              
              setTimeout(() => {
                btn.innerText = originalText;
                btn.style.backgroundColor = "";
                btn.style.color = "";
              }, 1500);
            })
            .catch(err => console.error(err));
          });
          
          document.title = `${product.name} - Notion Styled Store`;
        })
        .catch(err => {
          document.querySelector('.main-content').innerHTML = '<div class="error-state">Product not found.</div>';
        });

      // Fetch related products (excluding current)
      fetch("http://127.0.0.1:5001/product-items")
        .then(res => res.json())
        .then(data => {
          const relatedContainer = document.getElementById("related-products-container");
          relatedContainer.innerHTML = "";
          
          // filter out the current product and grab first 5
          const relatedProducts = data.products
            .filter(p => p.id !== currentProductId)
            .sort(() => 0.5 - Math.random()) // shuffle slightly
            .slice(0, 5);

          relatedProducts.forEach(product => {
            const price = (product.price).toFixed(2);
            relatedContainer.innerHTML += `
              <a href="product_detail.html?id=${product.id}" class="related-product-card">
                <div class="related-image-container">
                  <img src="${product.image}" alt="${product.name}">
                </div>
                <div class="related-info">
                  <h4 class="related-title">${product.name}</h4>
                  <div class="related-price">GH₵${price}</div>
                </div>
              </a>
            `;
          });
        })
        .catch(err => console.error("Failed to load related products", err));

      // Fetch and render dynamic reviews
      const fetchReviews = () => {
        fetch(`http://127.0.0.1:5001/product-items/${currentProductId}/reviews`)
          .then(res => res.json())
          .then(data => {
            const reviewsContainer = document.getElementById("reviews-container");
            reviewsContainer.innerHTML = "";
            
            if (!data.reviews || data.reviews.length === 0) {
              reviewsContainer.innerHTML = "<p class='text-muted'>No reviews yet. Be the first to review!</p>";
              return;
            }

            // sort reviews by newest first (descending)
            const sortedReviews = data.reviews.sort((a, b) => {
              const timeA = new Date(a.created_at).getTime();
              const timeB = new Date(b.created_at).getTime();
              if (isNaN(timeA) || isNaN(timeB)) return 0;
              return timeB - timeA;
            });

            sortedReviews.forEach(review => {
              const initial = review.name.charAt(0).toUpperCase();
              
              // Generate stars from integer
              let starsHtml = "";
              for(let i=0; i<5; i++){
                 starsHtml += i < review.rating ? "★" : "☆";
              }

              reviewsContainer.innerHTML += `
                <div class="review-item">
                  <div class="reviewer-avatar">${initial}</div>
                  <div class="review-content">
                    <span class="reviewer-name">${review.name}</span>
                    <span class="review-stars">${starsHtml}</span>
                    <p class="review-text">${review.text}</p>
                  </div>
                </div>
              `;
            });
          })
          .catch(err => console.error("Failed to load reviews:", err));
      };

      fetchReviews();

      // Handle Review Submission
      document.getElementById("review-form").addEventListener("submit", (e) => {
        e.preventDefault();

        if (!localStorage.getItem("authToken")) {
          alert("You must log in to submit a review.");
          window.location.href = `../login.html?redirect=product_detail&id=${currentProductId}`;
          return;
        }

        const btn = e.target.querySelector("button[type='submit']");
        btn.innerText = "Submitting...";
        btn.disabled = true;

        const payload = {
          rating: parseInt(document.getElementById("review-rating").value),
          text: document.getElementById("review-text").value
        };

        fetch(`http://127.0.0.1:5001/product-items/${currentProductId}/reviews`, {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          },
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(() => {
          e.target.reset();
          btn.innerText = "Submit Review";
          btn.disabled = false;
          fetchReviews(); // Refresh the list
        })
        .catch(err => {
          console.error(err);
          btn.innerText = "Error";
        });
      });
    }
    initProductDetail();
  </script>
</body>
</html>
