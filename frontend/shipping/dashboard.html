<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Dashboard</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="shipping.css">
</head>
<body>

  <div id="shipping-nav-container"></div>
  
  <main class="shipping-container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <h1 class="display-2" style="margin-bottom: var(--spacing-xs); font-size: var(--type-display-2-size); font-weight: var(--type-display-2-weight); letter-spacing: -1.875px;">Logistics Overview</h1>
    <p style="color: var(--color-ink-muted); font-size: var(--type-body-md-size); margin-top: 0;">Manage your assigned deliveries and update routing statuses.</p>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Active Deliveries</div>
        <div class="metric-value">24</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">In Transit</div>
        <div class="metric-value">12</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Delivered Today</div>
        <div class="metric-value">48</div>
      </div>
    </div>

    <h2 class="heading-2" style="margin-top: var(--spacing-xxl); margin-bottom: var(--spacing-md); font-size: var(--type-heading-2-size); font-weight: var(--type-heading-2-weight);">Delivery Queue</h2>
    <table class="recent-orders-table">
      <thead>
        <tr>
          <th>Delivery ID</th>
          <th>Customer Info</th>
          <th>Delivery Address (vw_Shipping_Delivery_Address)</th>
          <th>Est. Date</th>
          <th>Current Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="delivery-body">
        <!-- Mock Data inserted by JS -->
      </tbody>
    </table>
  </main>

  <script type="module" src="shipping-navbar.js"></script>
  <script>
    if (!localStorage.getItem("shippingAuthToken")) {
      window.location.href = "login.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetch("http://127.0.0.1:5001/shipping/deliveries", {
        headers: { "Authorization": "Bearer " + localStorage.getItem("shippingAuthToken") }
      })
      .then(res => res.json())
      .then(data => {
        const mockDeliveries = data.deliveries || [];
        const tbody = document.getElementById("delivery-body");
        tbody.innerHTML = "";
        
        mockDeliveries.forEach(del => {
          let statusClass = "status-pending";
          let statusText = "Pending";
          
          if (del.status === "transit") {
            statusClass = "status-transit";
            statusText = "On the way";
          } else if (del.status === "delivered") {
            statusClass = "status-delivered";
            statusText = "Delivered";
          }

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td><strong>${del.id}</strong></td>
            <td>
              <div style="font-weight: 500;">${del.customer}</div>
              <div style="color: var(--color-ink-muted); font-size: var(--type-caption-size);">${del.phone}</div>
            </td>
            <td>
              <div style="font-weight: 500;">${del.city}</div>
              <div style="color: var(--color-ink-secondary);">${del.street}</div>
              <div style="color: var(--color-ink-muted); font-size: var(--type-caption-size);">Landmark: ${del.landmark}</div>
            </td>
            <td>${del.estDate}</td>
            <td><span class="status-pill ${statusClass}">${statusText}</span></td>
            <td>
              <div class="update-action">
                <select id="status-${del.id}" class="text-input" style="padding: 4px; border-radius: var(--rounded-xs); font-size: var(--type-caption-size);">
                  <option value="pending" ${del.status === 'pending' ? 'selected' : ''}>Pending</option>
                  <option value="sent to port" ${del.status === 'sent to port' ? 'selected' : ''}>Sent to Port</option>
                  <option value="transit" ${del.status === 'transit' ? 'selected' : ''}>On the Way</option>
                  <option value="delivered" ${del.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                </select>
                <button class="button-utility" style="padding: 4px 8px;" onclick="updateStatus('${del.id}')">Update</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => console.error("Error fetching deliveries:", err));
    });

    window.updateStatus = async (deliveryId) => {
      const newStatus = document.getElementById('status-' + deliveryId).value;
      try {
        const response = await fetch('http://127.0.0.1:5001/shipping/deliveries/' + deliveryId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem("shippingAuthToken")
          },
          body: JSON.stringify({ status: newStatus })
        });
        if (response.ok) {
          alert('Status updated successfully!');
          window.location.reload();
        } else {
          alert('Error updating status');
        }
      } catch (err) {
        console.error(err);
      }
    };
  </script>
</body>
</html>
