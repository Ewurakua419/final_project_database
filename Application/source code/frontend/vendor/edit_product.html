<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Product - Vendor Portal</title>
  <link rel="stylesheet" href="vendor-base.css">

</head>
<body>

  <div id="vendor-nav-container"></div>
  <main class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <div style="margin-bottom: var(--spacing-xl); text-align: center;">
      <h1 class="display-2">Edit Product</h1>
    </div>

      <form class="feature-card" style="max-width: 600px; margin: 0 auto;" id="add-product-form">
        <div class="form-grid">
          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Product Name</label>
            <input type="text" class="text-input" id="prod-name" placeholder="e.g. Wireless Noise-Cancelling Headphones" required>
          </div>



          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Category</label>
            <select class="text-input" id="prod-category" required>
              <option value="fashion">Fashion</option>
              <option value="beauty">Beauty</option>
            </select>
          </div>

          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Price (GH₵)</label>
            <input type="number" step="0.01" class="text-input" id="prod-price" placeholder="299.99" required>
          </div>

          <div class="flex-col" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Initial Stock</label>
            <input type="number" class="text-input" id="prod-stock" placeholder="50" min="0" required>
          </div>

          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Image URL</label>
            <input type="url" class="text-input" id="prod-image" placeholder="https://example.com/image.jpg" required>
          </div>

          <div class="flex-col full-width" style="gap: var(--spacing-xs);">
            <label class="eyebrow text-muted">Description</label>
            <textarea class="text-input" id="prod-description" rows="3" placeholder="Enter product details..." required></textarea>
          </div>
        </div>

        <div style="margin-top: var(--spacing-xl); display: flex; gap: var(--spacing-md); justify-content: flex-end; align-items: center;">
          <a href="products.html" class="button-utility" style="text-decoration: none;">Cancel</a>
          <button type="submit" id="save-btn" class="button-primary">Save Changes</button>
        </div>
      </form>
    </main>

  <script type="module" src="vendor-navbar.js"></script>
  <script>
    if (!localStorage.getItem("vendorAuthToken")) {
      window.location.href = "login.html";
    }
    document.addEventListener("DOMContentLoaded", () => {


      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      
      if (!productId) {
        alert("No product ID provided!");
        window.location.href = "products.html";
        return;
      }

      // Fetch existing product data
      fetch("http://127.0.0.1:5001/product-items/" + productId)
        .then(res => res.json())
        .then(product => {
          document.getElementById("prod-name").value = product.name || '';
          document.getElementById("prod-category").value = product.type || 'tech';
          document.getElementById("prod-price").value = (product.price).toFixed(2);
          document.getElementById("prod-stock").value = product.stock || 0;
          document.getElementById("prod-image").value = product.image || '';
          document.getElementById("prod-description").value = product.description || '';
        })
        .catch(err => {
          console.error(err);
          alert("Failed to load product.");
        });


      document.getElementById("add-product-form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        const btn = document.getElementById("save-btn");
        const originalText = btn.innerText;
        btn.innerText = "Saving...";
        btn.disabled = true;

        const productData = {
          name: document.getElementById("prod-name").value,
          type: document.getElementById("prod-category").value,
          price: parseFloat(document.getElementById("prod-price").value),
          stock: parseInt(document.getElementById("prod-stock").value),
          image: document.getElementById("prod-image").value,
          description: document.getElementById("prod-description").value,
        };

        fetch("http://127.0.0.1:5001/vendor/products/" + productId, {
          method: "PUT",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("vendorAuthToken")
          },
          body: JSON.stringify(productData)
        })
        .then(res => {
          if (!res.ok) throw new Error("Failed to update product");
          return res.json();
        })
        .then(data => {
          alert("Product updated successfully!");
          window.location.href = "products.html";
        })
        .catch(err => {
          console.error(err);
          btn.innerText = "Error: Please try again";
          btn.style.backgroundColor = "var(--color-accent-orange)";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "";
            btn.disabled = false;
          }, 2000);
        });
      });
    });
  </script>
</body>
</html>
