<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Ecommerce store</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="checkout.css">
</head>
<body>

  <div id="navbar-container"></div>

  <div class="checkout-layout">
    
    <!-- Left Column: Form -->
    <div class="checkout-form-section">
      <form id="checkout-form">
        <h2 class="section-title">Contact Information</h2>
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" class="text-input" placeholder="hello@example.com" required>
        </div>
        
        <h2 class="section-title" style="margin-top: 2rem;">Shipping Address</h2>
        <div class="form-group">
          <label for="saved-address">Select Saved Address</label>
          <select id="saved-address" class="text-input" required style="appearance: auto; padding: 12px; margin-bottom: var(--spacing-sm);">
            <option value="">Loading addresses...</option>
          </select>
          <a href="../profile.html" style="font-size: 14px; color: var(--color-primary); text-decoration: none;">+ Manage Address Book</a>
        </div>
        
        <div class="form-group" style="margin-top: var(--spacing-md);">
          <label for="shipping-company">Shipping Carrier</label>
          <select id="shipping-company" class="text-input" required style="appearance: auto;">
            <option value="">Loading carriers...</option>
          </select>
        </div>

        <h2 class="section-title" style="margin-top: 2rem;">Payment</h2>
        <div class="form-group">
          <label for="payment-type">Payment Type</label>
          <select id="payment-type" class="text-input" required style="appearance: auto; padding: 12px; margin-bottom: var(--spacing-md);" onchange="togglePaymentFields()">
            <option value="card">Credit / Debit Card</option>
            <option value="momo">Mobile Money (Momo)</option>
            <option value="bank">Bank Transfer</option>
          </select>
        </div>
        
        <div id="card-fields" class="payment-fields-group">
          <div class="form-group" style="margin-bottom: var(--spacing-sm);">
            <label for="card-name">Cardholder Name</label>
            <input type="text" id="card-name" class="text-input" placeholder="e.g. John Doe">
          </div>
          <div class="form-group" style="margin-bottom: var(--spacing-sm);">
            <label for="card-brand">Card Brand</label>
            <select id="card-brand" class="text-input" style="appearance: auto; padding: 12px;">
              <option value="Visa">Visa</option>
              <option value="MasterCard">MasterCard</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom: var(--spacing-sm);">
            <label for="card-number">Card Number</label>
            <input type="text" id="card-number" class="text-input" placeholder="XXXX XXXX XXXX XXXX" maxlength="19">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-sm);">
            <div class="form-group">
              <label for="card-expiry">Expiry Date</label>
              <input type="month" id="card-expiry" class="text-input">
            </div>
            <div class="form-group">
              <label for="card-cvv">CVV</label>
              <input type="text" id="card-cvv" class="text-input" placeholder="123" maxlength="4">
            </div>
          </div>
        </div>

        <div id="momo-fields" class="payment-fields-group" style="display: none;">
          <div class="form-group">
            <label for="momo-network">Network</label>
            <select id="momo-network" class="text-input" style="appearance: auto; padding: 12px; margin-bottom: var(--spacing-sm);">
              <option value="MTN">MTN</option>
              <option value="Telecel">Telecel</option>
              <option value="AT">AT</option>
            </select>
          </div>
          <div class="form-group">
            <label for="momo-phone">Phone Number</label>
            <input type="tel" id="momo-phone" class="text-input" placeholder="024 123 4567">
          </div>
        </div>
        
        <div id="bank-fields" class="payment-fields-group" style="display: none;">
          <div class="form-group" style="margin-bottom: var(--spacing-sm);">
            <label for="bank-name">Bank Name</label>
            <input type="text" id="bank-name" class="text-input" placeholder="e.g. Ecobank">
          </div>
          <div class="form-group">
            <label for="bank-account">Account Number</label>
            <input type="text" id="bank-account" class="text-input" placeholder="Enter account number">
          </div>
        </div>

        <button type="submit" class="button-primary" id="place-order-btn" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 2rem;">
          Place Order
        </button>
      </form>
    </div>

    <!-- Right Column: Summary -->
    <div class="checkout-summary-section">
      <h2 class="section-title">Order Summary</h2>
      
      <div id="summary-items">
        <div class="loading-state">Loading your cart...</div>
      </div>

      <div class="summary-totals">
        <div class="summary-row">
          <span>Subtotal</span>
          <span id="summary-subtotal">GH₵0.00</span>
        </div>
        <div class="summary-row">
          <span>Shipping</span>
          <span id="summary-shipping">GH₵5.00</span>
        </div>
        <div class="summary-row total">
          <span>Total</span>
          <span id="summary-total">GH₵0.00</span>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="../navbar.js"></script>
  <script>
    function initCheckoutPage() {
      // Load cart data into summary
      fetch("http://127.0.0.1:5001/cart", {
        headers: {
          "Authorization": "Bearer " + localStorage.getItem("authToken")
        }
      })
        .then(res => res.json())
        .then(data => {
          if (data.cart.length === 0) {
            alert("Your cart is empty!");
            window.location.href = "../products/products.html"; // Redirect if empty
            return;
          }

          const itemsContainer = document.getElementById("summary-items");
          itemsContainer.innerHTML = "";
          
          let subtotal = 0;
          data.cart.forEach(item => {
            const product = item.product;
            const price = product.price;
            const itemTotal = price * item.quantity;
            subtotal += itemTotal;
            
            itemsContainer.innerHTML += `
              <div class="summary-item">
                <img src="${product.image}" class="summary-item-img" alt="${product.name}">
                <div class="summary-item-details">
                  <h4 class="summary-item-title">${product.name}</h4>
                  <div class="summary-item-meta">Qty: ${item.quantity}</div>
                </div>
                <div class="summary-item-price">GH₵${itemTotal.toFixed(2)}</div>
              </div>
            `;
          });

          const shipping = 5.00;
          const total = subtotal + shipping;

          document.getElementById("summary-subtotal").innerText = "GH₵" + subtotal.toFixed(2);
          document.getElementById("summary-shipping").innerText = "GH₵" + shipping.toFixed(2);
          document.getElementById("summary-total").innerText = "GH₵" + total.toFixed(2);
        });

      // Fetch customer profile details for wallet and address book
      fetch("http://127.0.0.1:5001/customer/profile", {
        headers: { "Authorization": "Bearer " + localStorage.getItem("authToken") }
      })
        .then(res => res.json())
        .then(profile => {
          if (profile.email) document.getElementById("email").value = profile.email;
          if (profile.phone_number) document.getElementById("momo-phone").value = profile.phone_number;
          
          const addrSelect = document.getElementById("saved-address");
          addrSelect.innerHTML = "";
          if (profile.addresses && profile.addresses.length > 0) {
            profile.addresses.forEach(addr => {
              // Use both lowercase 'landmark' and fallback to 'country' for the display label
              const landmarkLabel = addr.landmark || addr.country || "";
              const streetLabel = addr.street_address || addr.street || "";
              const addrData = { street_address: streetLabel, city: addr.city, landmark: landmarkLabel };
              addrSelect.innerHTML += `<option value='${JSON.stringify(addrData)}'>${streetLabel}, ${addr.city} - ${landmarkLabel}</option>`;
            });
          } else {
            addrSelect.innerHTML = "<option value=''>No addresses found</option>";
          }

          // Payment methods are now hardcoded in HTML since wallet was removed
        })
        .catch(err => console.error("Failed to load profile", err));

      // Fetch shipping carriers dynamically
      fetch("http://127.0.0.1:5001/shipping-companies")
        .then(res => res.json())
        .then(data => {
          const carrierSelect = document.getElementById("shipping-company");
          carrierSelect.innerHTML = "";
          const carriers = data.shipping_companies || [];
          if (carriers.length === 0) {
            carrierSelect.innerHTML = '<option value="">No carriers available</option>';
            return;
          }
          carriers.forEach(c => {
            carrierSelect.innerHTML += `<option value="${c.shipping_id}">${c.name}</option>`;
          });
        })
        .catch(err => {
          console.error("Failed to load carriers", err);
          document.getElementById("shipping-company").innerHTML = '<option value="SHIP01">Default Carrier</option>';
        });

      // Handle form submission
      document.getElementById("checkout-form").addEventListener("submit", (e) => {
        e.preventDefault();
        
        const btn = document.getElementById("place-order-btn");
        const originalText = btn.innerText;
        btn.innerText = "Processing...";
        btn.disabled = true;

        const addressVal = document.getElementById("saved-address").value;
        const paymentType = document.getElementById("payment-type").value;
        let paymentDetails = {};
        
        if (paymentType === "card") {
          const cardNum = document.getElementById("card-number").value || "0000000000000000";
          paymentDetails = {
            method: "card",
            brand: document.getElementById("card-brand").value,
            last_four: cardNum.slice(-4),
            card_name: document.getElementById("card-name").value || "Customer",
            expiry: document.getElementById("card-expiry").value || ""
          };
        } else if (paymentType === "momo") {
          paymentDetails = {
            method: "momo",
            brand: document.getElementById("momo-network").value,
            phone_number: document.getElementById("momo-phone").value
          };
        } else if (paymentType === "bank") {
          paymentDetails = {
            method: "bank",
            brand: document.getElementById("bank-name").value || "Bank Transfer",
            account_number: document.getElementById("bank-account").value
          };
        }

        if (!addressVal) {
          alert("Please select a shipping address.");
          btn.innerText = originalText;
          btn.disabled = false;
          return;
        }

        const shippingAddress = JSON.parse(addressVal);
        const shippingCompanyId = document.getElementById("shipping-company").value;

        fetch("http://127.0.0.1:5001/checkout", {
          method: "POST",
          headers: { 
            "Content-Type": "application/json",
            "Authorization": "Bearer " + localStorage.getItem("authToken")
          },
          body: JSON.stringify({ 
            shipping_address: shippingAddress,
            shipping_id: shippingCompanyId,
            payment_details: paymentDetails
          })
        })
        .then(res => {
          if (!res.ok) {
            return res.json().then(errData => {
              throw new Error(errData.error || "Checkout failed");
            });
          }
          return res.json();
        })
        .then(orderData => {
          // Store order id in session storage to display on next page
          sessionStorage.setItem("last_order_id", orderData.order_id);
          window.location.href = "../orders/order_confirmation.html";
        })
        .catch(err => {
          console.error(err);
          alert(err.message || "Checkout failed");
          btn.innerText = "Error: Please try again";
          btn.style.backgroundColor = "var(--color-accent-orange)";
          setTimeout(() => {
            btn.innerText = originalText;
            btn.style.backgroundColor = "";
            btn.disabled = false;
          }, 2000);
        });
      });
    }

    function togglePaymentFields() {
      const type = document.getElementById("payment-type").value;
      document.getElementById("card-fields").style.display = type === "card" ? "block" : "none";
      document.getElementById("momo-fields").style.display = type === "momo" ? "block" : "none";
      document.getElementById("bank-fields").style.display = type === "bank" ? "block" : "none";
    }
    window.togglePaymentFields = togglePaymentFields;

    initCheckoutPage();
  </script>
</body>
</html>
