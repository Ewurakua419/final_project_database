<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Dashboard</title>
  <link rel="stylesheet" href="../base.css">
  <link rel="stylesheet" href="shipping.css">
</head>
<body>

  <div id="shipping-nav-container"></div>
  
  <main class="shipping-container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-xxl);">
    <h1 class="display-2" style="margin-bottom: var(--spacing-xs); font-size: var(--type-display-2-size); font-weight: var(--type-display-2-weight); letter-spacing: -1.875px;">Logistics Overview</h1>
    <p style="color: var(--color-ink-muted); font-size: var(--type-body-md-size); margin-top: 0;">Manage your assigned deliveries and update routing statuses.</p>

    <div class="metrics-grid">
      <div class="metric-card">
        <div class="metric-label">Active Deliveries</div>
        <div class="metric-value" id="metric-active">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">In Transit</div>
        <div class="metric-value" id="metric-transit">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Delivered</div>
        <div class="metric-value" id="metric-delivered">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Shipping Earnings</div>
        <div class="metric-value" id="metric-earnings" style="color: var(--color-accent-green);">GH₵0.00</div>
      </div>
    </div>

    <h2 class="heading-2" style="margin-top: var(--spacing-xxl); margin-bottom: var(--spacing-md); font-size: var(--type-heading-2-size); font-weight: var(--type-heading-2-weight);">Delivery Queue</h2>
    <table class="recent-orders-table">
      <thead>
        <tr>
          <th>Delivery ID</th>
          <th>Customer Info</th>
          <th>Delivery Address (vw_Shipping_Delivery_Address)</th>
          <th>Est. Date</th>
          <th>Current Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="delivery-body">
        <!-- Mock Data inserted by JS -->
      </tbody>
    </table>
  </main>

  <script type="module" src="shipping-navbar.js"></script>
  <script>
    if (!localStorage.getItem("shippingAuthToken")) {
      window.location.href = "login.html";
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetch("http://127.0.0.1:5001/shipping/deliveries", {
        headers: { "Authorization": "Bearer " + localStorage.getItem("shippingAuthToken") }
      })
      .then(res => res.json())
      .then(data => {
        const mockDeliveries = data.deliveries || [];

        // Compute metrics from actual data
        const activeCount = mockDeliveries.filter(d => d.status !== 'delivered').length;
        const transitCount = mockDeliveries.filter(d => d.status === 'on the way').length;
        const deliveredCount = mockDeliveries.filter(d => d.status === 'delivered').length;
        const earnings = data.total_earnings || 0;

        document.getElementById("metric-active").textContent = activeCount;
        document.getElementById("metric-transit").textContent = transitCount;
        document.getElementById("metric-delivered").textContent = deliveredCount;
        document.getElementById("metric-earnings").textContent = "GH₵" + earnings.toFixed(2);

        const tbody = document.getElementById("delivery-body");
        tbody.innerHTML = "";
        
        mockDeliveries.forEach(del => {
          let statusClass = "status-pending";
          let statusText = del.status || "Pending";
          
          if (del.status === "on the way" || del.status === "transit") {
            statusClass = "status-transit";
            statusText = "On the way";
          } else if (del.status === "delivered") {
            statusClass = "status-delivered";
            statusText = "Delivered";
          } else if (del.status === "in port") {
            statusClass = "status-pending";
            statusText = "In Port";
          }

          const isDelivered = del.status === "delivered";
          const isPending = del.status === "pending";
          
          let actionContent = "";
          if (isDelivered) {
            actionContent = `
              <div style="display: flex; align-items: center; gap: 8px;">
                <span style="color: var(--color-accent-green); font-weight: 500; font-size: 13px; margin-right: var(--spacing-sm);">✓ Complete</span>
                <button class="button-utility" style="padding: 4px 8px;" onclick="toggleDetails('${del.id}')">Items</button>
              </div>
            `;
          } else if (isPending) {
            actionContent = `
              <div class="update-action" style="display: flex; align-items: center; gap: 8px;">
                <select id="status-${del.id}" class="text-input" disabled style="padding: 4px 8px; border-radius: var(--rounded-xs); font-size: var(--type-caption-size); appearance: auto; opacity: 0.6;">
                  <option value="pending" selected>Pending Dispatch</option>
                </select>
                <button class="button-utility" style="padding: 4px 8px;" onclick="toggleDetails('${del.id}')">Items</button>
              </div>
            `;
          } else {
            actionContent = `
              <div class="update-action" style="display: flex; align-items: center; gap: 8px;">
                <select id="status-${del.id}" class="text-input" data-original="${del.status}" onchange="onStatusChange('${del.id}')" style="padding: 4px 8px; border-radius: var(--rounded-xs); font-size: var(--type-caption-size); appearance: auto;">
                  <option value="in port" ${del.status === 'in port' ? 'selected' : ''}>In Port</option>
                  <option value="on the way" ${del.status === 'on the way' ? 'selected' : ''}>On the Way</option>
                  <option value="delivered">Delivered</option>
                </select>
                <button id="btn-${del.id}" class="button-utility" style="padding: 4px 8px; display: none;" onclick="updateStatus('${del.id}')">Update</button>
                <button class="button-utility" style="padding: 4px 8px;" onclick="toggleDetails('${del.id}')">Items</button>
              </div>
            `;
          }

          // Accordion panel HTML content
          let itemsHtml = `
            <div style="padding: 10px 14px; background: var(--color-canvas-soft); border: 1px solid var(--color-hairline); border-radius: var(--rounded-md); margin-top: 4px;">
              <div style="font-weight: 600; margin-bottom: 6px; font-size: 13px; color: var(--color-ink-secondary);">Package Items & Vendor Dispatch Checklist:</div>
              <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                <thead>
                  <tr style="border-bottom: 1px solid var(--color-hairline); text-align: left; color: var(--color-ink-muted);">
                    <th style="padding: 4px 8px;">Product</th>
                    <th style="padding: 4px 8px; width: 60px;">Qty</th>
                    <th style="padding: 4px 8px;">Vendor</th>
                    <th style="padding: 4px 8px; width: 180px;">Dispatch Status</th>
                  </tr>
                </thead>
                <tbody>
          `;
          
          if (del.items && del.items.length > 0) {
            del.items.forEach(item => {
              const dispText = item.is_dispatched ? "✓ In Port" : "⚠ Pending Vendor";
              const dispStyle = item.is_dispatched ? "color: var(--color-accent-green); font-weight: 600;" : "color: var(--color-accent-orange); font-weight: 600;";
              itemsHtml += `
                <tr style="border-bottom: 1px solid var(--color-hairline-soft);">
                  <td style="padding: 6px 8px;">${item.product_name}</td>
                  <td style="padding: 6px 8px;">${item.quantity}</td>
                  <td style="padding: 6px 8px; color: var(--color-ink-secondary);">${item.vendor_name}</td>
                  <td style="padding: 6px 8px; ${dispStyle}">${dispText}</td>
                </tr>
              `;
            });
          } else {
            itemsHtml += `<tr><td colspan="4" style="padding: 8px; color: var(--color-ink-muted); text-align: center;">No item details available.</td></tr>`;
          }
          itemsHtml += `</tbody></table></div>`;

          const trMain = document.createElement("tr");
          trMain.innerHTML = `
            <td><strong>${del.id}</strong></td>
            <td>
              <div style="font-weight: 500;">${del.customer}</div>
              <div style="color: var(--color-ink-muted); font-size: var(--type-caption-size);">${del.phone}</div>
            </td>
            <td>
              <div style="font-weight: 500;">${del.city}</div>
              <div style="color: var(--color-ink-secondary);">${del.street}</div>
              <div style="color: var(--color-ink-muted); font-size: var(--type-caption-size);">Landmark: ${del.landmark}</div>
            </td>
            <td>${del.estDate}</td>
            <td><span class="status-pill ${statusClass}">${statusText}</span></td>
            <td>${actionContent}</td>
          `;
          
          const trDetail = document.createElement("tr");
          trDetail.id = `details-${del.id}`;
          trDetail.style.display = "none";
          trDetail.innerHTML = `
            <td colspan="6" style="padding: 0 12px 12px 12px; border-top: none;">
              ${itemsHtml}
            </td>
          `;
          
          tbody.appendChild(trMain);
          tbody.appendChild(trDetail);
        });
      })
      .catch(err => console.error("Error fetching deliveries:", err));
    });

    window.toggleDetails = (deliveryId) => {
      const row = document.getElementById(`details-${deliveryId}`);
      if (row.style.display === "none") {
        row.style.display = "table-row";
      } else {
        row.style.display = "none";
      }
    };

    window.onStatusChange = (deliveryId) => {
      const select = document.getElementById(`status-${deliveryId}`);
      const btn = document.getElementById(`btn-${deliveryId}`);
      const original = select.getAttribute('data-original');
      if (select.value !== original) {
        btn.style.display = "inline-block";
      } else {
        btn.style.display = "none";
      }
    };

    window.updateStatus = async (deliveryId) => {
      const newStatus = document.getElementById('status-' + deliveryId).value;
      try {
        const response = await fetch('http://127.0.0.1:5001/shipping/deliveries/' + deliveryId, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + localStorage.getItem("shippingAuthToken")
          },
          body: JSON.stringify({ status: newStatus })
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok) {
          alert('Status updated successfully!');
          window.location.reload();
        } else {
          alert(data.error || 'Error updating status');
        }
      } catch (err) {
        console.error(err);
        alert('Network error communicating with server.');
      }
    };
  </script>
</body>
</html>
